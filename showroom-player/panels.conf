# Keep the two panel pages on the same origin as the showroom TV.
location = /c  { return 308 /c/$is_args$args; }
location = /c2 { return 308 /c2/$is_args$args; }
location = /c/  { rewrite ^ /__showroom_panel.html last; }
location = /c2/ { rewrite ^ /__showroom_panel.html last; }
location = /__showroom_panel.html {
    internal;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store";
    alias /var/www/showroom-tv/player/panel.html;
}
location = /screens/player/rotation.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    alias /var/www/showroom-tv/player/rotation.js;
}
