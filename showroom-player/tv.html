    "/screens/promo/video-01.tv.mp4": "/screens/promo/lite-video-01-db83562aff19.mp4",

};
var stage = document.getElementById('stage');
var clockOffset = 0;
var drawWide = HonorRotation.deck(LAND);
var vert = VERT.concat(HonorRotation.newPortraits);
var drawVertical = HonorRotation.deck(vert);
var timers = [];
var colState = null;
var stopped = false;
var managedBlackout = false;
var hasStarted = false;
var nextPack = null;

function assetPath(src){
  var url = new URL(src, location.origin);
  return url.origin === location.origin && !url.search && !url.hash ? url.pathname : src;
}

var defaultMedia = {wideVideos: LAND.slice(), videos: vert.slice(), blackout: false};
function optimizedList(sources, versions){
  var optimized = sources.map(function(src){ return versions[assetPath(src)] || src; });
  // An administrator may explicitly include both an original and its proxy.
  if (new Set(optimized.map(assetPath)).size !== sources.length) return sources.slice();
  return optimized;
}
function setTvProgram(wide, portraits){
  var keys = portraits.map(assetPath);
  LAND = optimizedList(wide, TV_MEDIA.wide);
  vert = optimizedList(portraits, TV_MEDIA.vertical);
  drawWide = HonorRotation.deck(LAND);
  drawVertical = HonorRotation.deck(vert);
  nextPack = null;
  var pool = Object.keys(TV_MEDIA.vertical);
  if (keys.length !== pool.length || !pool.length || !keys.every(function(key){ return pool.indexOf(key) >= 0; })) return;
  var rounds = HonorRotation.deck(TV_MEDIA.rounds);
  var pending = [];
  nextPack = function(){
    if (!pending.length) {
      pending = rounds().slice();
      if (Math.random() < 0.5) pending.reverse();
    }
    return pending.pop().url;
  };
}
setTvProgram(LAND, vert);


function almatyHour(){ return (new Date(Date.now() + clockOffset).getUTCHours() + 5) % 24; }
function isNight(){
  if (managedBlackout) return true;
  if (NIGHT === 'off') return false;
  var parts = NIGHT.split('-');
  var a = +parts[0], b = +parts[1];
  var h = almatyHour();
  return a > b ? (h >= a || h < b) : (h >= a && h < b);
}
var pageTag = '';
function syncTime(){
  return fetch(location.href, { method: 'HEAD', cache: 'no-store' }).then(function(r){
    var serverMs = Date.parse(r.headers.get('Date') || '');
    if (!isFinite(serverMs)) throw new Error('no-date');
    clockOffset = serverMs - Date.now();
    var tag = r.headers.get('ETag') || r.headers.get('Last-Modified') || '';
    if (!pageTag) pageTag = tag;
    else if (tag && tag !== pageTag) location.reload();
  }).catch(function(){ clockOffset = 0; });
}
function syncTimeFirst(){
  return new Promise(function(resolve){
    var done = 0;
    function finish(){ if (done) return; done = 1; resolve(); }
    setTimeout(finish, 2000);
    syncTime().then(finish, finish);
  });
}
setInterval(syncTime, 600000);

function clearTimers(){
  for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
  timers = [];
}
function later(fn, ms){
  var id = setTimeout(fn, ms);
  timers.push(id);
  return id;
}
function releaseVideo(v){
  if (!v) return;
  try { v.pause(); } catch (e) {}
  try { v.removeAttribute('src'); v.load(); } catch (e) {}
  if (v.parentNode) v.parentNode.removeChild(v);
}
function clearStage(){
  clearTimers();
  if (colState) {
    for (var i = 0; i < colState.length; i++) {
      clearTimeout(colState[i].timer);
      releaseVideo(colState[i].video);
    }
    colState = null;
  }
  var videos = stage.getElementsByTagName('video');
  for (var j = videos.length - 1; j >= 0; j--) releaseVideo(videos[j]);
  stage.innerHTML = '';
}

function makeVideo(src){
  var v = document.createElement('video');
  v.muted = true;
  v.setAttribute('muted', '');
  v.setAttribute('playsinline', '');
  v.playsInline = true;
  v.autoplay = true;
  v.preload = 'auto';
  if (v.getAttribute('src') !== src && v.src.indexOf(src) === -1) v.src = src;
  return v;
}
function tryPlay(v){
  var p = v.play();
  if (p && p.catch) {
    p.catch(function(){
      v.muted = true;
      var again = v.play();
      if (again && again.catch) again.catch(function(){});
    });
  }
}

function playFullscreen(urls, then, mosaic){
  if (stopped) return;
  if (!urls || !urls.length) { then(); return; }
  var idx = 0;
  function next(){
    if (stopped) return;
    if (idx >= urls.length) { then(); return; }
    clearStage();
    var src = urls[idx++];
    var v = makeVideo(src);
    v.className = mosaic ? 'hs-fill hs-mosaic' : 'hs-fill';
    var advanced = false;
    function go(){ if (advanced || stopped || v.parentNode !== stage) return; advanced = true; next(); }
    v.addEventListener('ended', go);
    v.addEventListener('error', function(){ later(go, 400); });
    stage.appendChild(v);
    HonorRotation.watchPlayback(v, function(){ return !advanced && !stopped && v.parentNode === stage; }, go);
    tryPlay(v);

  }
  next();
}

// Keep a separate reservation for each column while clips of different lengths finish.
function playColumns(then){
  if (nextPack) { playFullscreen([nextPack()], then, true); return; }
  if (stopped) return;
  clearStage();
  var row = document.createElement('div');
  row.className = 'hs-cols';
  colState = [];
  var states = colState;
  var completed = new Set();

  function playCol(colIdx){
    if (stopped || states !== colState) return;
    var s = states[colIdx];
    var item = drawVertical(states.map(function(column){ return column.src; }));
    // With exactly three portraits the two neighbours reserve the other options.
    if (!item) item = s.src;
    if (!item) return;
    s.src = item;
    var container = s.el;
    clearTimeout(s.timer);
    var video = makeVideo(item);
    function advance(){
      if (stopped || states !== colState || s.video !== video) return;
      completed.add(item);
      if (completed.size === vert.length) { then(); return; }
      playCol(colIdx);
    }
    function watchdog(){
      if (states !== colState || s.video !== video) return;
      clearTimeout(s.timer);
      s.timer = setTimeout(advance, 12000);
    }
    video.addEventListener('loadeddata', watchdog);
    video.addEventListener('timeupdate', watchdog);
    video.addEventListener('ended', advance);
    video.addEventListener('error', function(){
      if (states !== colState || s.video !== video) return;
      clearTimeout(s.timer);
      s.timer = setTimeout(advance, 800);
    });
    var old = s.video;
    s.video = video;
    releaseVideo(old);
    container.appendChild(video);
    watchdog();
    tryPlay(video);
  }

  for (var i = 0; i < 3; i++) {
    var el = document.createElement('div');
    el.className = 'hs-col';
    el.setAttribute('data-col', String(i));
    row.appendChild(el);
    colState.push({ src: null, video: null, timer: null, el: el });
  }
  stage.appendChild(row);
  for (var c = 0; c < 3; c++) playCol(c);
}

function cycle(){
  if (stopped) return;
  if (isNight()) { updateNight(); return; }
  if (!LAND.length && !vert.length) { clearStage(); return; }
  if (vert.length && (MODE === 'cols' || !LAND.length)) { playColumns(cycle); return; }
  playWide(drawWide());
}

function playWide(src){
  if (stopped) return;
  var next = drawWide();
  playFullscreen([src], function(){
    if (MODE === 'full' || !vert.length) playWide(next);
    else playColumns(function(){ playWide(next); });
  });
}

function updateNight(){
  if (!hasStarted) return;
  if (isNight()) {
    if (stopped) return;
    stopped = true;
    clearStage();
  } else if (stopped) {
    stopped = false;
    cycle();
  }
}
setInterval(updateNight, 1000);

document.addEventListener('click', function(){
  var e = document.documentElement;
  if (!document.fullscreenElement && e.requestFullscreen) e.requestFullscreen().catch(function(){});
});
setTimeout(function(){ location.reload(); }, 3600 * 1000);
syncTimeFirst().then(function(){
  HonorRotation.manage('b', function(media) {
    setTvProgram(media.wideVideos, media.videos);
    managedBlackout = media.blackout;
  }, function() {
    clearStage();
    hasStarted = true; stopped = false;
    cycle();
  }, defaultMedia);
});
