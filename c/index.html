<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HONOR — экран c</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
#stage{position:fixed;inset:0;background:#000;transform:rotate(180deg) scaleX(-1);-webkit-transform:rotate(180deg) scaleX(-1)}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .8s}
.layer.on{opacity:1}
#hint{position:fixed;left:0;right:0;bottom:0;color:#888;font:14px sans-serif;text-align:center;padding:6px;background:#000a;display:none}
</style></head><body>
<div id="stage"></div>
<div id="hint">Коснитесь экрана один раз — полноэкранный режим</div>
<script>
// Плеер экранов магазина. Chrome 88+.
// Параметры: ?photo=8, ?night=21-9 (чёрный 21:00–09:00), ?night=off
// Transform на #stage компенсирует сохранённую ориентацию/отзеркаливание Windows на панели.
const P = new URLSearchParams(location.search);
const PHOTO_SEC = +(P.get('photo')||8);
const NIGHT = P.get('night')||'21-9';
const PLAYLIST = [
  {t:'v',s:'../media/video-05.mp4'},
  {t:'p',s:'../media/photo-01.jpg'},{t:'p',s:'../media/photo-02.jpg'},{t:'p',s:'../media/photo-03.jpg'},
  {t:'v',s:'../media/video-03.mp4'},
  {t:'p',s:'../media/photo-04.jpg'},{t:'p',s:'../media/photo-05.jpg'},{t:'p',s:'../media/photo-06.jpg'},
  {t:'v',s:'../media/video-04.mp4'},
  {t:'p',s:'../media/photo-07.jpg'},{t:'p',s:'../media/photo-08.jpg'},{t:'p',s:'../media/photo-09.jpg'},
  {t:'v',s:'../media/video-01.mp4'},
  {t:'p',s:'../media/photo-10.jpg'},{t:'p',s:'../media/photo-11.jpg'},
  {t:'v',s:'../media/video-02.mp4'}
];
const stage=document.getElementById('stage');let i=0,timer=null,cur=null;
function isNight(){ if(NIGHT==='off')return false; var parts=NIGHT.split('-'); var a=+parts[0],b=+parts[1]; var h=new Date().getHours(); return a>b ? (h>=a||h<b) : (h>=a&&h<b); }
function clear(){ if(timer){clearTimeout(timer);timer=null;} }
function show(){
  clear();
  if(isNight()){ if(cur){cur.remove();cur=null;} timer=setTimeout(show,60000); return; }
  var it=PLAYLIST[i%PLAYLIST.length]; i++;
  var el;
  if(it.t==='p'){ el=new Image(); el.className='layer'; el.src=it.s;
    el.onload=function(){swap(el,function(){timer=setTimeout(show,PHOTO_SEC*1000)});}; el.onerror=function(){timer=setTimeout(show,500);}; }
  else { el=document.createElement('video'); el.className='layer'; el.muted=true; el.setAttribute('playsinline',''); el.playsInline=true; el.autoplay=true; el.preload='auto'; el.src=it.s;
    el.oncanplay=function(){ if(!el._d){el._d=1; swap(el,function(){ try{el.play();}catch(e){} });} };
    el.onended=function(){show();}; el.onerror=function(){timer=setTimeout(show,500);};
    timer=setTimeout(function(){ if(!el._d) show(); },15000); }
  stage.appendChild(el);
}
function swap(el,cb){ requestAnimationFrame(function(){ el.classList.add('on'); var old=cur; cur=el; if(old){ old.classList.remove('on'); setTimeout(function(){old.remove();},900);} if(cb)cb(); }); }
document.addEventListener('click',function(){ var e=document.documentElement; if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen().catch(function(){}); });
setTimeout(function(){location.reload();}, 3600*1000);
show();
</script></body></html>
