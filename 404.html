<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Перенаправление</title>
<script>
(function(){
  var path = location.pathname || '/';
  var rest = location.search || '';
  var hash = location.hash || '';
  function go(base, extra){
    var q = rest;
    if (extra) {
      q = q ? (q + '&' + extra) : ('?' + extra);
    }
    location.replace(base + q + hash);
  }
  var kiosk = path.match(/^\/kiosk\/?([^/]+)?\/?$/i);
  if (kiosk) {
    var slug = kiosk[1];
    go('/kiosk/', slug ? ('store=' + encodeURIComponent(slug)) : '');
    return;
  }
  var podbor = path.match(/^\/podbor\/?([^/]+)?\/?$/i);
  if (podbor) {
    var slug2 = podbor[1];
    go('/podbor/', slug2 ? ('store=' + encodeURIComponent(slug2)) : '');
    return;
  }
  document.title = 'Страница не найдена';
})();
</script>
</head>
<body style="margin:0;background:#111;color:#ccc;font:16px/1.4 sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
Страница не найдена
</body></html>
